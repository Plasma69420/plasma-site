<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews – Strive Cheats</title>
<meta name="description" content="Real customer reviews and product pictures from verified Strive Cheats buyers.">
<meta name="theme-color" content="#04141b">
<link rel="canonical" href="https://strivecheats.store/reviews">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=79">
<link rel="stylesheet" href="/assets/pages.css?v=79">
<link rel="stylesheet" href="/assets/strive.css?v=22">
</head>
<body>
<main class="lwrap" style="padding-top:100px">
  <div class="rvhead">
    <h1>Customer Reviews</h1>
    <p>Real reviews and pictures from verified buyers</p>
    <div class="rvsum" id="sum" hidden><b id="avg"></b><div><span class="st" id="avgStars"></span><small id="cnt"></small></div></div>
  </div>
  <div class="rvtabs" id="tabs" hidden><button class="on" data-t="all">All reviews</button><button data-t="pics">Product pictures <span id="picCount"></span></button></div>
  <div class="rvgrid" id="grid"></div>
  <div class="rvgal" id="gal" hidden></div>
  <div class="empty" id="none" hidden><b>No reviews yet</b>Bought a product? Claim the Customer role in our Discord, then run /vouch to leave the first review.</div>
</main>
<div class="lightbox" id="lb"><img alt=""></div>
<script src="/assets/site.js?v=81"></script>
<script>
const grid = document.getElementById("grid"), gal = document.getElementById("gal"), lb = document.getElementById("lb");
const pic = r => CONFIG.api + r.proof;
Api.get("/api/vouches").then(d => {
  if (!d.total) { document.getElementById("none").hidden = false; return; }
  const n = Math.round(d.average);
  document.getElementById("avg").textContent = d.average.toFixed(1);
  document.getElementById("avgStars").textContent = "★".repeat(n) + "☆".repeat(5 - n);
  document.getElementById("cnt").textContent = d.total + " review" + (d.total === 1 ? "" : "s");
  document.getElementById("sum").hidden = false;
  const withPics = d.reviews.filter(r => r.proof);
  grid.innerHTML = d.reviews.map(r => `<article class="rvcard">${r.proof ? `<a class="pic" data-src="${esc(pic(r))}"><img src="${esc(pic(r))}" alt="Product picture from ${esc(r.username || "a customer")}" loading="lazy"></a>` : ""}
    <div class="bd"><div class="top"><span><span class="st">${"★".repeat(r.stars)}<span style="opacity:.3">${"★".repeat(5 - r.stars)}</span></span><span class="ver">✓ VERIFIED</span></span><span>${new Date(r.at).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })}</span></div>
    <p>${esc(r.message)}</p><div class="by"><img src="${esc(r.avatar || "https://cdn.discordapp.com/embed/avatars/0.png")}" alt="">${esc(r.username || "Customer")}</div></div></article>`).join("");
  gal.innerHTML = withPics.map(r => `<a data-src="${esc(pic(r))}"><img src="${esc(pic(r))}" alt="Product picture" loading="lazy"></a>`).join("");
  if (withPics.length) { document.getElementById("tabs").hidden = false; document.getElementById("picCount").textContent = "(" + withPics.length + ")"; }
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    const pics = b.dataset.t === "pics"; grid.hidden = pics; gal.hidden = !pics;
  });
}).catch(() => { document.getElementById("none").hidden = false; });
document.addEventListener("click", e => {
  const a = e.target.closest("[data-src]");
  if (a) { lb.querySelector("img").src = a.dataset.src; lb.classList.add("on"); return; }
  if (lb.classList.contains("on")) lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });
</script>
</body>
</html>
