<body>
<main class="lwrap">
  <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to home</a>
  <div class="lh"><div><h1 id="title">All Products</h1><p id="sub">Browse everything we offer</p></div><span class="cnt" id="cnt"></span></div>
  <div class="lbar">
    <label class="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Search products..." autocomplete="off"></label>
    <select id="sort"><option value="pop">Most Popular</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="name">Name</option></select>
  </div>
  <div class="lgrid" id="grid"></div>
  <div class="empty" id="none" hidden><b id="noneT">No products found</b><span id="noneS">Try a different search.</span></div>
</main>
<script src="/assets/site.js?v=97"></script>
<script>
const catName = p => p.account ? "Fortnite Accounts" : p.game === "Spoofer" ? "HWID Spoofer" : p.game;
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const cartI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.400"/><circle cx="18" cy="20" r="1.400"/><path d="M2 3h3l2.400 12.200a1.500 1.500 0 0 0 1.500 1.200h8.700a1.500 1.500 0 0 0 1.500-1.100L21 8H6"/></svg>';
const catSlug = new URLSearchParams(location.search).get("category");
const cats = [...new Set([...CONFIG.products.map(catName), "Rust"])];
const cat = catSlug ? cats.find(c => slugify(c) === catSlug) : null;
let live = {};
const base = CONFIG.products.filter(p => !cat || catName(p) === cat);
document.getElementById("title").textContent = cat ? cat : "All Products";
document.getElementById("sub").textContent = cat ? "Browse " + cat.toLowerCase() : "Browse everything we offer";
if (cat) document.title = cat + " – Strive Cheats";
const from = p => Math.min(...p.plans.map(x => x.p));
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase(), sort = document.getElementById("sort").value;
  let list = base.filter(p => (p.name + " " + p.type + " " + p.game).toLowerCase().includes(q));
  if (sort === "low") list.sort((a, b) => from(a) - from(b));
  else if (sort === "high") list.sort((a, b) => from(b) - from(a));
  else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById("cnt").textContent = list.length + " product" + (list.length === 1 ? "" : "s");
  document.getElementById("none").hidden = list.length > 0;
  if (!list.length && !base.length) { document.getElementById("noneT").textContent = (cat || "This category") + " is coming soon"; document.getElementById("noneS").innerHTML = 'Prices and keys are being finalized. <a href="' + CONFIG.discord + '" target="_blank" rel="noopener" style="text-decoration:underline">Join our Discord</a> for updates.'; }
  document.getElementById("grid").innerHTML = list.map((p, i) => {
    const [label, cls] = STATUS[statusOf(p, live)] || STATUS.undetected;
    const stock = p.account ? "In Stock" : label;
    const sc = p.account ? "ok" : (cls === "updating" ? "warn" : cls === "down" || cls === "detected" ? "bad" : "ok");
    return `<a class="lcard" href="/${p.slug}"><div class="im">${p.img ? `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">` : ""}${i === 0 && !q && sort === "pop" ? '<span class="bdg l">Popular</span>' : ""}<span class="bdg r ${sc}">${esc(stock)}</span></div>
      <div class="bd"><div><b>${esc(p.name)}</b><small>Starting at</small><strong>${money(from(p))}</strong></div><span class="cb">${cartI}</span></div></a>`;
  }).join("");
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
render();
Api.status().then(s => { live = s; render(); });
</script>
