<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guides | Strive Cheats</title>
<meta name="description" content="Setup guides for Strive Cheats customers.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1fb6ff">
<link rel="canonical" href="https://strivecheats.store/guides">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=79">
<link rel="stylesheet" href="/assets/pages.css?v=79">
<link rel="stylesheet" href="/assets/strive.css?v=48">
</head>
<body>
<main class="lwrap" style="padding-top:100px;padding-bottom:70px">
  <div id="gdRoot"><div class="gd-state"><b>Loading guides...</b></div></div>
</main>
<div class="gd-zoom" id="gdZoom" hidden><img alt=""></div>
<script src="/assets/site.js?v=95"></script>
<script>
const root = document.getElementById("gdRoot");
const ICON = { lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>', warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v5M12 18h.01"/></svg>', note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>' };
// inline text: escape first, then **bold**, `code` and [links](https://...)
const inline = s => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

function gate(title, text, btn) {
  root.innerHTML = `<div class="gd-state"><span class="gd-lock">${ICON.lock}</span><h1>${esc(title)}</h1><p>${text}</p>${btn || ""}</div>`;
}
function blockHtml(b) {
  switch (b.t) {
    case "h": return `<h4>${inline(b.text)}</h4>`;
    case "p": return `<p>${inline(b.text)}</p>`;
    case "ol": return `<ol>${b.items.map(i => `<li>${inline(i)}</li>`).join("")}</ol>`;
    case "ul": return `<ul>${b.items.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`;
    case "code": return `<div class="gd-code"><button type="button" class="gd-copy">Copy</button><pre>${esc(b.text)}</pre></div>`;
    case "img": return `<figure class="gd-img"><img data-f="${esc(b.file)}" alt="${esc(b.alt || "")}"><figcaption>Click to enlarge</figcaption></figure>`;
    case "warn": return `<div class="gd-call warn"><i>${ICON.warn}</i><div>${inline(b.text)}</div></div>`;
    case "note": return `<div class="gd-call"><i>${ICON.note}</i><div>${inline(b.text)}</div></div>`;
    case "tabs": return `<div class="gd-tabs"><div class="gd-tabbar">${b.tabs.map((t, i) => `<button type="button" class="${i ? "" : "on"}" data-i="${i}">${esc(t.label)}</button>`).join("")}</div>${b.tabs.map((t, i) => `<div class="gd-pane"${i ? " hidden" : ""}>${t.blocks.map(blockHtml).join("")}</div>`).join("")}</div>`;
    default: return "";
  }
}
async function loadImages(scope, token) {
  for (const im of scope.querySelectorAll("img[data-f]")) {
    Api.get("/api/guides/img?f=" + encodeURIComponent(im.dataset.f), token).then(d => { im.src = d.data; im.classList.add("ok"); }).catch(() => { im.alt = "Image unavailable"; });
  }
}
function wire(scope) {
  scope.querySelectorAll(".gd-copy").forEach(b => b.addEventListener("click", () => {
    const t = b.nextElementSibling.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch { } a.remove(); });
    b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400);
  }));
  scope.querySelectorAll(".gd-tabs").forEach(tb => tb.querySelectorAll(".gd-tabbar button").forEach(btn => btn.addEventListener("click", () => {
    tb.querySelectorAll(".gd-tabbar button").forEach(x => x.classList.toggle("on", x === btn));
    [...tb.children].filter(c => c.classList.contains("gd-pane")).forEach((p, i) => p.hidden = i !== +btn.dataset.i);
  })));
  scope.querySelectorAll(".gd-img img").forEach(im => im.addEventListener("click", () => { if (!im.src) return; const z = document.getElementById("gdZoom"); z.querySelector("img").src = im.src; z.hidden = false; }));
}
document.getElementById("gdZoom").addEventListener("click", e => { e.currentTarget.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("gdZoom").hidden = true; });

// product page for each guide (the "Details" link)
const PAGE = { "fortnite-private": "/fortnite-private", "temp-spoofer": "/temp-spoofer", "perm-spoofer": "/perm-spoofer", "secure-fn-accounts": "/fortnite-accounts" };
const ACK = s => "gd_ack_" + s;
const acked = s => { try { return sessionStorage.getItem(ACK(s)) === "1"; } catch { return false; } };
let IDX = null, AUTH = null;

function askAck(slug, onYes) {
  const m = document.createElement("div"); m.className = "gd-modal";
  m.innerHTML = '<div class="gd-mbox" role="dialog" aria-modal="true"><span class="gd-mpill">' + ICON.warn + ' WARNING</span><h3>Do not skip any steps</h3><p>Every step in this setup guide is <b>100% required</b>. Do not skip, reorder, or skim past anything. If you miss a step, the product will not function properly.</p><button type="button" class="gd-yes">I understand, open guide</button><button type="button" class="gd-no">Cancel</button></div>';
  const close = () => { m.remove(); document.removeEventListener("keydown", esc2); };
  const esc2 = e => { if (e.key === "Escape") close(); };
  m.querySelector(".gd-yes").addEventListener("click", () => { try { sessionStorage.setItem(ACK(slug), "1"); } catch { } close(); onYes(); });
  m.querySelector(".gd-no").addEventListener("click", close);
  m.addEventListener("click", e => { if (e.target === m) close(); });
  document.addEventListener("keydown", esc2); document.body.appendChild(m); m.querySelector(".gd-yes").focus();
}
function openGuide(slug) {
  const go = () => { history.pushState(null, "", "/guides?g=" + slug); render(); window.scrollTo({ top: 0 }); };
  if (acked(slug)) go(); else askAck(slug, go);
}

function hub() {
  document.title = "Setup Guides | Strive Cheats";
  const total = IDX.guides.length, cats = ["All Guides", ...IDX.categories.filter(c => IDX.guides.some(g => g.category === c))];
  const tags = ["Fortnite", "Spoofer", "Accounts"];
  root.innerHTML = `<section class="gh-hero"><span class="gh-pill">${ICON.note} Setup Center</span><h1>Choose Your<br>Setup Guide</h1><span class="gh-count">${total} guide${total === 1 ? "" : "s"} available</span><p>Browse our available products and open the official setup guide to get started.</p>
    <div class="gh-search"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="ghQ" type="search" placeholder="Search setup guides..." autocomplete="off"></label><button type="button" id="ghGo">Search</button></div>
    <div class="gh-tags"><span>Popular:</span>${tags.map(t => '<button type="button" data-t="' + t + '">' + t + '</button>').join("")}</div></section>
    <section class="gh-all"><span class="gh-pill soft">All Guides</span><h2>Setup Guides</h2><p>Browse all available products and open their setup documentation</p><small id="ghShow"></small>
    <div class="gh-bar"><label class="gh-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="ghQ2" type="search" placeholder="Search setup guides..." autocomplete="off"></label><select id="ghCat">${cats.map(c => '<option>' + esc(c) + '</option>').join("")}</select></div>
    <div class="gh-grid" id="ghGrid"></div></section>`;
  const grid = document.getElementById("ghGrid"), q1 = document.getElementById("ghQ"), q2 = document.getElementById("ghQ2"), cat = document.getElementById("ghCat");
  const draw = () => {
    const q = q2.value.trim().toLowerCase(), c = cat.value;
    const list = IDX.guides.filter(g => (c === "All Guides" || g.category === c) && (!q || (g.title + " " + g.category + " " + g.summary).toLowerCase().includes(q)));
    const soon = c === "All Guides" ? (IDX.soon || []).filter(s => !q || s.toLowerCase().includes(q)) : [];
    document.getElementById("ghShow").textContent = "Showing " + list.length + " of " + total + " guides";
    grid.innerHTML = list.map(g => `<article class="gh-card"><div class="gh-ct"><div><h3>${esc(g.title)}</h3><span>${esc(g.category)}</span></div><i class="gh-badge">${ICON.note} Guide</i></div><p>${esc(g.summary)}</p><div class="gh-cb"><button type="button" class="gh-open" data-s="${g.slug}">Open Guide <b>&rarr;</b></button>${PAGE[g.slug] ? '<a href="' + PAGE[g.slug] + '">Details <b>&rarr;</b></a>' : ""}</div></article>`).join("")
      + soon.map(s => `<article class="gh-card soon"><div class="gh-ct"><div><h3>${esc(s)}</h3><span>Setup guide</span></div><i class="gh-badge">Soon</i></div><p>The setup guide for ${esc(s)} is on its way.</p><div class="gh-cb"><span class="gh-wait">Coming soon</span></div></article>`).join("")
      || '<div class="gd-state" style="grid-column:1/-1"><b>No guides match your search.</b></div>';
    grid.querySelectorAll(".gh-open").forEach(b => b.addEventListener("click", () => openGuide(b.dataset.s)));
  };
  const sync = v => { q1.value = v; q2.value = v; draw(); };
  q2.addEventListener("input", () => { q1.value = q2.value; draw(); });
  q1.addEventListener("input", () => { q2.value = q1.value; draw(); });
  cat.addEventListener("change", draw);
  document.getElementById("ghGo").addEventListener("click", () => { draw(); document.querySelector(".gh-all").scrollIntoView({ behavior: "smooth" }); });
  q1.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("ghGo").click(); });
  root.querySelectorAll(".gh-tags button").forEach(b => b.addEventListener("click", () => { sync(b.dataset.t); document.querySelector(".gh-all").scrollIntoView({ behavior: "smooth" }); }));
  draw();
}

function view(slug) {
  root.innerHTML = '<a class="gd-back" href="/guides">&larr; All guides</a><div class="gd-layout solo"><article class="gd-main" id="gdMain"><div class="gd-state"><b>Loading...</b></div></article><nav class="gd-toc" id="gdToc"></nav></div>';
  root.querySelector(".gd-back").addEventListener("click", e => { e.preventDefault(); history.pushState(null, "", "/guides"); render(); window.scrollTo({ top: 0 }); });
  show(slug, AUTH);
}

function render() {
  const g = new URLSearchParams(location.search).get("g");
  const found = g && IDX.guides.find(x => x.slug === g);
  if (found && acked(found.slug)) return view(found.slug);
  hub();
  if (found) askAck(found.slug, () => render());
}

async function main() {
  const a = Auth.get();
  if (!a) {
    gate("Guides are for customers", "Log in with the Discord account you bought with to open the setup guides.", '<a class="btn btn-main" id="gdLogin" href="#">Log in with Discord</a>');
    document.getElementById("gdLogin").addEventListener("click", e => { e.preventDefault(); try { sessionStorage.setItem("strive_next", "/guides"); } catch { } location.href = Auth.loginUrl(); });
    return;
  }
  try { IDX = await Api.get("/api/guides", a.token); }
  catch (e) {
    if (e.status === 401) { try { localStorage.removeItem("strive_auth"); } catch { } return gate("Session expired", "Log in with Discord again to open the guides.", '<a class="btn btn-main" href="/login">Log in</a>'); }
    if (e.status === 403) return gate("Customers only", esc(e.message) + " If you just purchased, give it a minute or open a ticket and we will sort it out.", '<div class="gd-btns"><a class="btn btn-main" href="/products">Browse products</a><a class="btn btn-ghost" href="' + CONFIG.discord + '" target="_blank" rel="noopener">Open a ticket</a></div>');
    return gate("Guides are unavailable", "We could not load the guides right now. Please try again in a minute.");
  }
  AUTH = a;
  addEventListener("popstate", render);
  render();
}
async function show(slug, a) {
  const m = document.getElementById("gdMain"), toc = document.getElementById("gdToc");
  m.innerHTML = '<div class="gd-state"><b>Loading...</b></div>';
  try {
    const g = await Api.get("/api/guides/get?slug=" + encodeURIComponent(slug), a.token);
    document.title = g.title + " Guide | Strive Cheats";
    m.innerHTML = `<div class="gd-top"><span class="gd-pill">${esc(g.category)}</span><h2>${esc(g.title)}</h2></div>` + g.steps.map((s, i) => { const nx = g.steps[i + 1], lab = x => x.id === "FIX" ? "Fix" : "Step " + x.id; return `<section class="gd-step" id="s${esc(s.id)}"><div class="gd-sh"><span>${s.id === "FIX" ? "FIX" : "STEP " + esc(s.id)}</span><h3>${esc(s.title)}</h3></div>${s.blocks.map(blockHtml).join("")}${nx ? `<a class="gd-next" href="#s${esc(nx.id)}" data-to="s${esc(nx.id)}"><span><small>Next</small>${esc(lab(nx))}: ${esc(nx.title)}</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>` : `<a class="gd-next done" href="/guides" data-all="1"><span><small>All done</small>Back to all guides</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>`}</section>`; }).join("");
    toc.innerHTML = '<b>On this page</b>' + g.steps.map(s => `<a href="#s${esc(s.id)}">${s.id === "FIX" ? "Fix" : s.id}. ${esc(s.title)}</a>`).join("");
    wire(m); loadImages(m, a.token);
    m.querySelectorAll(".gd-next").forEach(n => n.addEventListener("click", e => { e.preventDefault(); if (n.dataset.all) { history.pushState(null, "", "/guides"); render(); window.scrollTo({ top: 0 }); } else { const t = document.getElementById(n.dataset.to); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); } }));
  } catch (e) { m.innerHTML = '<div class="gd-state"><b>Could not load this guide.</b><p>' + esc(e.message || "") + '</p></div>'; }
}
main();
</script>
</body>
</html>
