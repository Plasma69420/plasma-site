<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Strive Cheats</title>
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=79">
<link rel="stylesheet" href="/assets/pages.css?v=79">
<link rel="stylesheet" href="/assets/strive.css?v=3">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<main class="page"><div class="wrap auth">
  <div class="authcard">
    <div class="lock" id="lockIco"></div>
    <h2 id="h">Welcome back</h2>
    <p id="p">Sign in with Discord to see your orders and manage your account.</p>
    <a class="dbtn" id="dbtn" href="#"></a>
    <div class="msg" id="msg"></div>
    <small>We only read your Discord name, avatar and email. We never post for you.</small>
  </div>
</div></main>
<script src="/assets/site.js?v=79"></script>
<script>
document.getElementById("lockIco").innerHTML = ico.lock;
const btn = document.getElementById("dbtn"), msg = document.getElementById("msg");
btn.innerHTML = ico.discord + "Continue with Discord";
const fail = t => { msg.className = "msg err"; msg.textContent = t; };

(async () => {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  if (q.get("error")) { fail(q.get("error") === "access_denied" ? "Login was cancelled." : "Discord returned an error. Try again."); }
  if (h.get("access_token")) {
    history.replaceState(null, "", location.pathname);   // remove the token from the address bar
    let ok = false;
    try { ok = h.get("state") && h.get("state") === sessionStorage.getItem("plasma_state"); sessionStorage.removeItem("plasma_state"); } catch { }
    if (!ok) return fail("Login check failed. Please try again.");
    document.getElementById("h").textContent = "Signing you in...";
    try {
      const r = await fetch("https://discord.com/api/v10/users/@me", { headers: { Authorization: "Bearer " + h.get("access_token") } });
      if (!r.ok) throw 0;
      const user = await r.json();
      Auth.set({ token: h.get("access_token"), exp: Date.now() + Math.max(60, +h.get("expires_in") || 604800) * 1000 - 60000, user });
      location.replace("/account");
    } catch { document.getElementById("h").textContent = "Welcome back"; fail("Could not read your Discord profile. Try again."); }
    return;
  }
  if (Auth.get()) location.replace("/account");
})();
btn.addEventListener("click", e => { e.preventDefault(); location.href = Auth.loginUrl(); });
</script>
</body>
</html>
