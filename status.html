<script>
const catName = p => p.game === "Spoofer" ? "HWID Spoofers" : p.game;
const LABEL = { undetected: ["Operational", "ok"], updating: ["Updating", "warn"], maintenance: ["Maintenance", "warn"], detected: ["Detected", "bad"], down: ["Down", "bad"], development: ["In Development", "warn"], unknown: ["Unavailable", "idle"] };
const ago = ms => { if (!ms) return "No changes yet"; const d = new Date(ms), n = new Date(); const days = Math.round((new Date(n.toDateString()) - new Date(d.toDateString())) / 864e5); return days <= 0 ? "Updated today" : days === 1 ? "Updated yesterday" : "Updated " + days + " days ago"; };
const SHOWN = {}, ING = {"roblox-external": "In development"};
document.getElementById("rep").href = CONFIG.tickets || CONFIG.discord;
function show(live) {
  const have = live && Object.keys(live).length > 0;
  const groups = {}, count = { ok: 0, warn: 0, bad: 0, soon: 0 }, attention = [];
  CONFIG.products.filter(p => !p.account).forEach(p => (groups["All products"] = groups["All products"] || []).push(p));
  document.getElementById("groups").innerHTML = Object.entries(groups).map(([g, list]) => `
    <section class="sv-sec"><div class="sv-h"><h3>${esc(g)}</h3><span>${list.length} product${list.length === 1 ? "" : "s"}</span></div>
    <div class="sv-grid">${list.map(p => {
      const rec = live && live[p.slug];
      let name, k, up, from = "";
      if (p.soon) { name = "Coming soon"; k = "soon"; up = "Not released yet"; count.soon++; }
      else {
        const key = p.dev ? "development" : p.down ? "down" : (have && rec ? rec.status : "unknown");
        [name, k] = LABEL[key] || LABEL.unknown; if (k === "ok" || k === "warn" || k === "bad") count[k]++;
        if (k === "warn" || k === "bad") attention.push(p.name + " is " + name.toLowerCase());
        up = ING[p.slug] || ago(SHOWN[p.slug] || (rec && rec.updated));
        const ps = (p.plans || []).map(x => x.p).filter(Number.isFinite); from = ps.length ? money(Math.min(...ps)) : "";
      }
      return `<a class="sc ${k}" href="${p.soon ? "#" : "/" + p.slug}">
        <span class="sc-i">${p.img ? `<img src="${p.img}" alt="" loading="lazy">` : ""}</span>
        <span class="sc-b"><b>${esc(p.name)}</b><small>${esc(p.game === "Spoofer" ? "HWID Spoofer" : p.game)} · ${esc(up)}</small><span class="sc-pill"><i></i>${name}</span></span>
        <span class="sc-r">${from ? "<small>From</small><b>" + from + "</b>" : ""}</span>
      </a>`;
    }).join("")}</div></section>`).join("");
  const devN = CONFIG.products.filter(p => p.dev).length, bad = count.bad, warn = Math.max(0, count.warn - devN), ok = count.ok, k = !have ? "idle" : bad ? "bad" : warn ? "warn" : "ok";
  document.getElementById("hero").className = "sv-hero " + k;
  document.getElementById("eb").textContent = { ok: "Live", warn: "Heads up", bad: "Incident", idle: "Offline" }[k];
  document.getElementById("hT").textContent = !have ? "Status unavailable" : bad ? "Some products have problems" : warn ? warn + " product" + (warn > 1 ? "s" : "") + " updating" : "All products updated";
  document.getElementById("hS").textContent = !have ? "We could not reach the status service. Try again in a minute." : warn || bad ? attention.join(" • ") : "Every product was updated today" + (devN ? " · " + CONFIG.products.filter(p => p.dev).map(p => p.name).join(", ") + " is in development" : "") + ".";
  document.getElementById("hTime").textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " · refreshes every minute";
  document.getElementById("counts").innerHTML = [["ok", "Operational", ok], ["warn", "Updating", warn], ["bad", "Down", bad], devN && !count.soon ? ["soon", "In development", devN] : ["soon", "Coming soon", count.soon]].map(([c, n, v]) => '<div class="' + c + '"><b>' + v + '</b><small>' + n + '</small></div>').join("");
}
async function load() { show(await Api.status()); }
load(); setInterval(() => { if (!document.hidden) load(); }, 60000);
</script>
