<body>
<main class="lwrap" style="padding-top:100px">
  <div style="text-align:center;margin-bottom:30px"><h1 style="font:700 clamp(34px,4.6vw,48px)/1.1 'Manrope';letter-spacing:-.03em;color:#fff">Product Status</h1><p id="sum" style="margin-top:12px;color:var(--muted)">Checking...</p></div>
  <div id="groups"></div>
</main>
<script src="/assets/site.js?v=82"></script>
<script>
const catName = p => p.account ? "Fortnite Full Access" : p.game === "Spoofer" ? "HWID Changers" : p.game === "Rainbow Six Siege" ? "Rainbow Six Siege Softwares" : p.game + " Softwares";
const okI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.500 12 2.500 2.500 4.500-5"/></svg>';
const names = { undetected: "Operational", updating: "Updating", detected: "Detected", down: "Down", maintenance: "Maintenance" };
async function load() {
  const live = await Api.status();
  const groups = {}; let issues = 0;
  CONFIG.products.filter(p => !p.account).forEach(p => (groups[catName(p)] = groups[catName(p)] || []).push(p));
  document.getElementById("groups").innerHTML = Object.entries(groups).map(([g, list]) => `
    <div class="stt-h"><h2>${esc(g)}</h2><small>(${list.length} product${list.length === 1 ? "" : "s"})</small></div>
    <div class="lgrid" style="padding-bottom:10px">${list.map(p => {
      const st = p.down ? "down" : ((live[p.slug] || {}).status || "undetected");
      if (st !== "undetected") issues++;
      return `<a class="scard2" href="/${p.slug}"><div class="im">${p.img ? `<img src="${p.img}" alt="" loading="lazy">` : ""}</div><div class="bd"><b>${esc(p.name)}</b>
        <div class="ft"><span class="pillst ${st}">${st === "undetected" ? okI : ""}${names[st] || "Operational"}</span><strong>${money(Math.min(...p.plans.map(x => x.p)))}</strong></div></div></a>`;
    }).join("")}</div>`).join("");
  document.getElementById("sum").textContent = issues ? `${issues} product${issues > 1 ? "s" : ""} need${issues > 1 ? "" : "s"} attention. See the badges below.` : "All products are currently undetected and working perfectly";
}
load(); setInterval(load, 60000);
</script>
</body>
