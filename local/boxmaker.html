<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product boxes for Chest Cheat and Rob Run</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>body { background: #111; color: #ddd; font: 13px system-ui; margin: 16px; } canvas { width: 49%; border-radius: 8px; } pre { margin: 0 0 10px; }</style>
</head>
<body>
<pre id="log"></pre>
<div id="out"></div>
<script>
/* Product box images (1920x1080, like img/box-*.webp): the game's art tinted in the site's steel blue behind, a retail box
   with a dark-to-teal front, the Strive logo and website on top, the product's character in the middle, platform icons along
   the bottom, "PRIVATE" on the spine. Chest Cheat = a Fortnite loot chest, Rob Run = the police officer from the game's key art.
   /local/boxmaker.html previews, ?save=1 writes local/cards/box-chest-cheat.webp, box-rob-run.webp and bg-robrun.webp */
const W = 1920, H = 1080;
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("load " + src)); i.src = src; });
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const log = t => document.getElementById("log").textContent += t + "\n";
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lum = (d, i) => (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) / 255;
const RAMP = [[0, [10, 26, 34]], [.45, [34, 82, 102]], [.8, [70, 138, 164]], [1, [150, 205, 224]]];
const ramp = t => { for (let k = 1; k < RAMP.length; k++) if (t <= RAMP[k][0]) { const [a, ca] = RAMP[k - 1], [b, cb] = RAMP[k], f = (t - a) / (b - a); return ca.map((v, j) => v + (cb[j] - v) * f); } return RAMP[RAMP.length - 1][1]; };

// grey, contrasty version of a cut-out (transparent background), like the characters on the other boxes
function greyscale(src, lo = 20, span = 215) {
  const g = mk(src.width, src.height), gx = g.getContext("2d", { willReadFrequently: true }); gx.drawImage(src, 0, 0);
  const id = gx.getImageData(0, 0, g.width, g.height), d = id.data, ls = [];
  for (let i = 0; i < d.length; i += 16) if (d[i + 3] > 200) ls.push(lum(d, i));
  ls.sort((a, b) => a - b); const a = ls[Math.floor(ls.length * .02)], b = ls[Math.floor(ls.length * .99)];
  for (let i = 0; i < d.length; i += 4) { let v = clamp((lum(d, i) - a) / (b - a)); v = v * v * (3 - 2 * v) * .5 + v * .5; d[i] = d[i + 1] = d[i + 2] = Math.round(lo + v * span); }
  gx.putImageData(id, 0, 0); return g;
}
// bring out detail in a (soft, upscaled) grey cut-out: unsharp mask at two radii (fine edges + local contrast), alpha untouched
function detail(src, fine = 1.4, fineAmt = 1.1, wide = 22, wideAmt = .55) {
  const w = src.width, h = src.height, mkBlur = r => { const b = mk(w, h), bx = b.getContext("2d", { willReadFrequently: true }); bx.filter = "blur(" + r + "px)"; bx.drawImage(src, 0, 0); return bx.getImageData(0, 0, w, h).data; };
  const sx = src.getContext("2d", { willReadFrequently: true }), id = sx.getImageData(0, 0, w, h), d = id.data, b1 = mkBlur(fine), b2 = mkBlur(wide);
  for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 8) continue; const v = d[i] + fineAmt * (d[i] - b1[i]) + wideAmt * (d[i] - b2[i]); d[i] = d[i + 1] = d[i + 2] = v < 0 ? 0 : v > 255 ? 255 : v; }
  const out = mk(w, h); out.getContext("2d").putImageData(id, 0, 0); return out;
}
// the police officer from the Rob Run key art (outline traced like in recolor.html)
async function copCut() {
  const im = await load("/local/src/dl-bg/robrun-key.webp");
  const P = [[258, 92], [262, 55], [290, 35], [330, 30], [370, 40], [395, 70], [402, 105], [398, 140], [388, 175], [380, 195], [410, 215], [455, 230], [492, 262], [520, 300], [528, 345], [530, 400], [528, 460], [518, 510], [495, 545], [470, 570], [462, 590], [575, 722], [558, 738], [440, 615], [430, 640], [425, 720], [430, 812], [150, 812], [150, 700], [135, 640], [140, 590], [150, 555], [130, 520], [60, 490], [42, 460], [50, 420], [75, 380], [100, 345], [122, 302], [160, 296], [195, 280], [232, 248], [258, 232], [262, 190], [262, 150]].map(([sx, sy]) => [840 + sx / .974, 250 + sy / .974]);
  const SX = 840, SY = 250, SW = 620, SH = 830, cut = mk(SW, SH), cx = cut.getContext("2d");
  cx.drawImage(im, SX, SY, SW, SH, 0, 0, SW, SH); cx.drawImage(im, 1335, 688, 44, 44, 1280 - SX, 764 - SY, 48, 48);   // (paints the mouse cursor out of the art)
  const m = mk(SW, SH), mx = m.getContext("2d"); mx.fillStyle = "#fff"; mx.beginPath(); P.forEach(([sx, sy], i) => { i ? mx.lineTo(sx - SX, sy - SY) : mx.moveTo(sx - SX, sy - SY); }); mx.closePath(); mx.fill();
  const mb = mk(SW, SH), mbx = mb.getContext("2d"); mbx.filter = "blur(1.4px)"; mbx.drawImage(m, 0, 0);
  cx.globalCompositeOperation = "destination-in"; cx.drawImage(mb, 0, 0);
  // remove the pale background left inside the outline: near-white pixels connected to the outside (flood fill from the cut edge),
  // then a few more rounds eating a lighter fringe along the edge
  { const id = cx.getImageData(0, 0, SW, SH), d = id.data, N = SW * SH, L = i => .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2], out = i => d[i * 4 + 3] < 20;
    const grow = (thr, maxDepth) => { let q = []; for (let i = 0; i < N; i++) if (!out(i)) { const x = i % SW; if ((x > 0 && out(i - 1)) || (x < SW - 1 && out(i + 1)) || (i >= SW && out(i - SW)) || (i < N - SW && out(i + SW))) q.push(i); }
      for (let depth = 0; q.length && depth < maxDepth; depth++) { const nq = []; for (const i of q) { if (out(i) || L(i) < thr) continue; d[i * 4 + 3] = 0; const x = i % SW; if (x > 0) nq.push(i - 1); if (x < SW - 1) nq.push(i + 1); if (i >= SW) nq.push(i - SW); if (i < N - SW) nq.push(i + SW); } q = nq; } };
    grow(205, 400); grow(165, 4);
    // the pale grey-blue wedge of background beside the neck (left of the jaw, above the shoulder): cold-toned (blue >= red) and not dark;
    // the officer's skin and khaki shirt are warm (red > blue) and the tie is dark, so they stay
    for (let y = 125; y < 290; y++) for (let x = 195; x < 300; x++) { const i = y * SW + x; if (out(i)) continue; if (d[i * 4 + 2] >= d[i * 4] - 2 && L(i) > 85) d[i * 4 + 3] = 0; }
    cx.putImageData(id, 0, 0); }
  // crop to the figure's box
  const x0 = Math.min(...P.map(p => p[0])) - SX, x1 = Math.max(...P.map(p => p[0])) - SX, y0 = Math.min(...P.map(p => p[1])) - SY, y1 = SH;
  const out = mk(Math.round(x1 - x0), Math.round(y1 - y0)); out.getContext("2d").drawImage(cut, x0, y0, out.width, out.height, 0, 0, out.width, out.height); return out;
}
// the Treasure Hunt (pirate) chest: a small screenshot, upscaled 4x first, then cut out along a traced outline
async function pirateChestCut() {
  const im = await load("/local/src/dl-bg/pirate-chest.png"), K = 4, P = [[76, 36], [90, 26], [112, 23], [134, 33], [182, 33], [198, 24], [222, 23], [240, 30], [245, 52], [244, 80], [244, 112], [236, 126], [247, 141], [244, 158], [236, 166], [200, 167], [170, 166], [136, 165], [96, 165], [74, 150], [72, 137], [78, 124], [77, 90], [75, 55]];
  const big = mk(im.width * K, im.height * K), bx = big.getContext("2d"); bx.imageSmoothingQuality = "high"; bx.drawImage(im, 0, 0, big.width, big.height);
  const m = mk(big.width, big.height), mx = m.getContext("2d"); mx.fillStyle = "#fff"; mx.filter = "blur(2px)"; mx.beginPath(); P.forEach(([x, y], i) => { i ? mx.lineTo(x * K, y * K) : mx.moveTo(x * K, y * K); }); mx.closePath(); mx.fill();
  bx.globalCompositeOperation = "destination-in"; bx.drawImage(m, 0, 0);
  const x0 = Math.min(...P.map(p => p[0])) * K, x1 = Math.max(...P.map(p => p[0])) * K, y0 = Math.min(...P.map(p => p[1])) * K, y1 = Math.max(...P.map(p => p[1])) * K;
  const out = mk(x1 - x0, y1 - y0); out.getContext("2d").drawImage(big, x0, y0, out.width, out.height, 0, 0, out.width, out.height); return out;
}
// the same chest as a clean 512x512 render on a flat grey backdrop (fortnite.gg): key the backdrop out by flood-filling the neutral grey
// in from the edges (the chest itself is purple and gold, so the fill can't get in), then crop to the chest
async function pirateChestHD() {
  const im = await load("/local/src/dl-bg/pirate-chest-hd.webp"), W0 = im.width, H0 = im.height, c = mk(W0, H0), x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0);
  const id = x.getImageData(0, 0, W0, H0), d = id.data, N = W0 * H0, seen = new Uint8Array(N), bg = [d[0], d[1], d[2]];
  const near = i => { const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx - mn < 26 && Math.abs(r - bg[0]) < 70; };
  const q = []; for (let X = 0; X < W0; X++) { q.push(X, N - W0 + X); } for (let Y = 0; Y < H0; Y++) { q.push(Y * W0, Y * W0 + W0 - 1); }
  while (q.length) { const i = q.pop(); if (seen[i] || !near(i)) continue; seen[i] = 1; d[i * 4 + 3] = 0; const X = i % W0; if (X > 0) q.push(i - 1); if (X < W0 - 1) q.push(i + 1); if (i >= W0) q.push(i - W0); if (i < N - W0) q.push(i + W0); }
  x.putImageData(id, 0, 0);
  let x0 = W0, x1 = 0, y0 = H0, y1 = 0; for (let i = 0; i < N; i++) if (d[i * 4 + 3] > 40) { const X = i % W0, Y = (i / W0) | 0; if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y; }
  const out = mk(x1 - x0 + 1, y1 - y0 + 1); out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height); return out;
}
async function chestCut() {
  const img = await load("/local/src/dl-bg/chest-b.webp"), t = mk(img.naturalWidth, img.naturalHeight), tx = t.getContext("2d", { willReadFrequently: true }); tx.drawImage(img, 0, 0);
  const td = tx.getImageData(0, 0, t.width, t.height).data; let x0 = t.width, x1 = 0, y0 = t.height, y1 = 0;
  for (let y = 0; y < t.height; y++) for (let X = 0; X < t.width; X++) if (td[(y * t.width + X) * 4 + 3] > 40) { if (X < x0) x0 = X; if (X > x1) x1 = X; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const out = mk(x1 - x0 + 1, y1 - y0 + 1); out.getContext("2d").drawImage(img, x0, y0, out.width, out.height, 0, 0, out.width, out.height); return out;
}

// The existing boxes all share one backdrop and one box frame, so the empty frame is the per-pixel median of them (the
// characters differ box to box and drop out). Only the character, the label bottom-left and the ghost left on the front change.
let TPL = null;
async function template() {
  if (TPL) return TPL;
  const names = ["box-fortnite-private.webp", "box-fortnite-slotted.webp", "box-r6.webp", "box-rust.webp", "box-arc.webp", "box-roblox.webp", "box-temp.webp", "box-perm.webp", "box-retrac.webp", "box-fortnite-ai.png", "box-accounts.webp"];
  const imgs = await Promise.all(names.map(n => load("/img/" + n)));
  const datas = imgs.map(im => { const c = mk(W, H), x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0, W, H); return x.getImageData(0, 0, W, H).data; });
  const out = mk(W, H), ox = out.getContext("2d", { willReadFrequently: true }), oi = ox.createImageData(W, H), v = new Array(datas.length);
  for (let i = 0; i < oi.data.length; i += 4) { for (let k = 0; k < 3; k++) { for (let j = 0; j < datas.length; j++) v[j] = datas[j][i + k]; v.sort((a, b) => a - b); oi.data[i + k] = v[v.length >> 1]; } oi.data[i + 3] = 255; }
  ox.putImageData(oi, 0, 0);
  // the spine's "PRIVATE" is cleanest on the Fortnite Private box itself (same frame): copy the whole spine from it
  ox.drawImage(imgs[0], 600, 0, 90, H, 600, 0, 90, H);
  // front: clear the ghost with the frame's own vertical gradient (read from clean strips at both edges of the front), keeping the
  // website text on top and the platform icons at the bottom
  const FX0 = 724, FX1 = 1200, id = ox.getImageData(0, 0, W, H), d = id.data;
  // the edge strips come from the Fortnite Private box itself (its colours are the reference; the median is lightened by the other boxes' glow)
  const fd = datas[0];
  const strip = (y, xa, xb) => { let r = 0, g = 0, b = 0, n = 0; for (let X = xa; X < xb; X++) { const i = (y * W + X) * 4; r += fd[i]; g += fd[i + 1]; b += fd[i + 2]; n++; } return [r / n, g / n, b / n]; };
  const rows = []; for (let y = 0; y < H; y++) rows[y] = [strip(y, 1206, 1218), strip(y, 698, 714)];
  for (let y = 130; y < 925; y++) for (let X = FX0; X < FX1; X++) { const i = (y * W + X) * 4, f = (X - FX0) / (FX1 - FX0), a = rows[y][1], b = rows[y][0]; for (let k = 0; k < 3; k++) d[i + k] = a[k] + (b[k] - a[k]) * f; }
  ox.putImageData(id, 0, 0);
  // the product label on the bottom of the spine ("FORTNITE", "RETRAC"... on the other boxes): clear it by stretching the clean
  // spine pixels just above it down over it; my own label is drawn on later
  const sp = ox.getImageData(603, 946, 82, 1); for (let y = 950; y < 992; y++) ox.putImageData(sp, 603, y);
  TPL = out; return out;
}
async function makeBox(j) {
  const tpl = await template(), c = mk(W, H), x = c.getContext("2d"); x.drawImage(tpl, 0, 0);
  // the character, grey with the boxes' contrast, inside the front (x 690..1222, y 135..935)
  x.save(); x.beginPath(); x.rect(690, 135, 532, 800); x.clip();
  const sub = await j.subject(), g0 = greyscale(sub), g = j.sharpen === "soft" ? detail(g0, 2.4, .7, 30, .12) : j.sharpen ? detail(g0) : g0, sc = Math.min(j.maxW / g.width, j.maxH / g.height), dw = g.width * sc, dh = g.height * sc, px = 956 - dw / 2 + (j.dx || 0), py = j.bottom ? 935 - dh : 535 - dh / 2 + (j.dy || 0);
  if (!j.bottom) { x.save(); x.filter = "blur(18px)"; x.fillStyle = "rgba(30,50,60,.55)"; x.beginPath(); x.ellipse(px + dw / 2, py + dh + 6, dw * .45, 22, 0, 0, Math.PI * 2); x.fill(); x.restore(); }
  x.drawImage(g, px, py, dw, dh);
  // retouch: clone clean cloth over a leftover square (from painting the mouse cursor out of the source art), feathered edge
  if (j.clone) { const [cx0, cy0, cw, ch, fx, fy] = j.clone, snap = mk(cw, ch), sx = snap.getContext("2d"); sx.drawImage(c, fx, fy, cw, ch, 0, 0, cw, ch);
    sx.globalCompositeOperation = "destination-in"; const rg = sx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * .25, cw / 2, ch / 2, Math.min(cw, ch) * .52); rg.addColorStop(0, "#000"); rg.addColorStop(1, "rgba(0,0,0,0)"); sx.fillStyle = rg; sx.fillRect(0, 0, cw, ch);
    x.drawImage(snap, cx0, cy0); }
  // soft fog where the character meets the bottom of the front (like the other boxes)
  const fg = x.createLinearGradient(0, 760, 0, 935); fg.addColorStop(0, "rgba(61,138,166,0)"); fg.addColorStop(1, "rgba(61,139,168,.9)"); x.fillStyle = fg; x.fillRect(690, 760, 532, 175);
  x.restore();
  // label bottom-left, like "FORTNITE" / "RETRAC" on the others
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.letterSpacing = "0.5px";
  const lines = j.tag.split("|"); x.font = "900 " + (lines.length > 1 ? 17 : 21) + "px Montserrat";
  lines.forEach((ln, i) => x.fillText(ln, 644, (lines.length > 1 ? 966 : 972) + i * 19));   // centred on the spine, near its bottom
  return c;
}const JOBS = [
  { out: "box-chest-cheat.webp", art: "/local/cards/bg-fortnite.webp", spine: "PRIVATE", tag: "CHEST|CHEAT", subject: pirateChestHD, sharpen: true, maxW: 480, maxH: 420, dy: -25 },
  { out: "box-rob-run.webp", art: "/local/src/dl-bg/robrun-shot2.jpg", spine: "PRIVATE", tag: "ROB|RUN", sharpen: true, clone: [1066, 618, 70, 70, 1066, 538], subject: copCut, maxW: 530, maxH: 800, bottom: true }
];
(async () => {
  try {
    await document.fonts.load("800 50px Montserrat"); await document.fonts.load("900 24px Montserrat"); await document.fonts.load("600 22px Montserrat");
    const save = new URLSearchParams(location.search).has("save");
    for (const j of JOBS) {
      const c = await makeBox(j); document.getElementById("out").appendChild(c);
      if (save) { const b = await new Promise(r => c.toBlob(r, "image/webp", .9)); log(await (await fetch("/__save/" + j.out, { method: "PUT", body: b })).text()); }
    }
    // background for the Rob Run pages: the jewelry-store screenshot, cropped to the middle (no game HUD) and darkened
    if (save) { const im = await load("/local/src/dl-bg/robrun-shot1.jpg"), c = mk(1920, 1080), cx = c.getContext("2d"); cx.drawImage(im, 330, 190, 1260, 708, 0, 0, 1920, 1080); cx.fillStyle = "rgba(6,10,14,.45)"; cx.fillRect(0, 0, 1920, 1080); const b = await new Promise(r => c.toBlob(r, "image/webp", .8)); log(await (await fetch("/__save/bg-robrun.webp", { method: "PUT", body: b })).text()); }
    log(save ? "saved" : "preview (add ?save=1 to save)");
  } catch (e) { log("ERROR " + e.message); console.error(e); }
})();
</script>
</body>
</html>
